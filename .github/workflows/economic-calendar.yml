name: Economic Calendar Sync

on:
  schedule:
    - cron: "0 11 * * 1-5"  # 7 AM ET (UTC-4) Mon-Fri
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and upsert economic calendar
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/cron/economic-calendar" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail \
            --silent \
            --show-error
